[Command]
Command="
    copyq:
    // Run ~/bin/randomsignature, which picks a random signature and copies it
    // to the clipboard itself (pbcopy on macOS, copyq/xclip/wl-copy on Linux).
    execute('sh', '-c', '\"$HOME/bin/randomsignature\"')"
GlobalShortcut=meta+ctrl+u
IsGlobalShortcut=true
Name=Random Signature
